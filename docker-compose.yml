services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app1:
    build: .
    environment:
      SPRING_DATA_REDIS_HOST: redis
      RATELIMITER_IMPLEMENTATION: redis-token-bucket
      APP_INSTANCE_ID: app1
    depends_on:
      - redis

  app2:
    build: .
    environment:
      SPRING_DATA_REDIS_HOST: redis
      RATELIMITER_IMPLEMENTATION: redis-token-bucket
      APP_INSTANCE_ID: app2
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2