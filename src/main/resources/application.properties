server.port=8080

# Read by RateLimiterConfig. Swapping implementations is just changing this line.
ratelimiter.implementation=token-bucket
ratelimiter.capacity=10
ratelimiter.window-ms=60000
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.instance-id=local
# --- PostgreSQL (abuse-event audit log) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/ratelimiter
spring.datasource.username=ratelimiter
spring.datasource.password=ratelimiter
spring.flyway.enabled=true

# --- Abuse detection thresholds (all configurable) ---
abuse.velocity.bucket-ms=1000
abuse.velocity.history-size=10
abuse.velocity.min-samples=5
abuse.velocity.sigma=3.0
abuse.velocity.std-floor=1.0

abuse.enumeration.window-ms=10000
abuse.enumeration.distinct-threshold=20

abuse.credential-stuffing.window-ms=10000
abuse.credential-stuffing.min-attempts=10
abuse.credential-stuffing.failure-ratio=0.5

# --- Escalation (shared via Redis) ---
abuse.escalation.window-ms=300000
abuse.escalation.temp-block-threshold=2
abuse.escalation.long-ban-threshold=5
abuse.escalation.temp-block-seconds=60
abuse.escalation.long-ban-seconds=3600

# --- Endpoint token costs (cost-weighted limiting) ---
abuse.cost.default=1
abuse.cost.post-orders=5

# --- Dashboard ---
dashboard.volume.bucket-ms=10000